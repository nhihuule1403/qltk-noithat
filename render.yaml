# Render Blueprint (gói Free): backend Node + frontend React (static site)
# Frontend chuyển tiếp /api/* sang backend nên trình duyệt chỉ làm việc với một domain (không cần CORS).
services:
  - type: web
    name: qltk-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: QLTonKhoNoiThat
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: TZ
        value: Asia/Ho_Chi_Minh

  - type: web
    name: qltk-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # Nếu Render đặt cho backend địa chỉ khác (có thêm hậu tố), sửa dòng destination
      # này trong Dashboard → qltk-frontend → Redirects/Rewrites
      - type: rewrite
        source: /api/*
        destination: https://qltk-backend.onrender.com/api/*
      # SPA: mọi đường dẫn khác trả về index.html
      - type: rewrite
        source: /*
        destination: /index.html
